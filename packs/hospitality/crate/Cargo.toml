[package]
name = "sws-pack-hospitality"
description = "Open-source hospitality vertical pack for Solo Website System (SWS): venue manifest, semantic Menu JSON-LD, inquiry validation, and advisory VA ABC advertising lint."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
