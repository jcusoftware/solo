[package]
name = "sws-security"
description = "Host-testable security headers, Turnstile verification, streaming body limits, and generic form validation primitives for Solo Website System (SWS)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = { version = "1", features = ["derive"] }
worker = { version = "0.9" }
