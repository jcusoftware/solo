[package]
name = "sws-worker-studio"
description = "Optional Studio control-plane Cloudflare Worker for Solo Website System (SWS): D1 workspace registry scaffold with strict request bounds and dual security headers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps the command batch as untouched text so `sws_ir::edit::parse_batch`
# keeps its duplicate-key and precision checks on session messages.
serde_json = { version = "1", features = ["raw_value"] }
sws-assets = { path = "../sws-assets" }
sws-ir = { path = "../sws-ir" }
sws-security = { path = "../sws-security" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.9", features = ["d1"] }
# Streamed request-body reads with a hard byte cap.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]
# Local integration tests ONLY (scripts/test-studio-sessions.mjs, tests/integration/studio-assets.test.mjs):
# lets `X-Sws-Dev-*` headers stand in for real authentication (#65) and drive test hooks.
# NEVER enabled by the release build; `npm run check:studio:release` (part of
# `npm run verify`) and CI enforce that.
insecure-dev-auth = []
