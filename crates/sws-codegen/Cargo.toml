[package]
name = "sws-codegen"
description = "Host-only generator for TypeScript declarations and Draft 2020-12 JSON Schemas derived from the SWS Rust types."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
sws-ir = { path = "../sws-ir", features = ["jsonschema"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
