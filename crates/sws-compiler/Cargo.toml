[package]
name = "sws-compiler"
description = "Deterministic, wasm32-clean HTML/CSS/SEO/security compiler with built-in WCAG 2.2 AA diagnostics for Solo Website System (SWS)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sws-ir = { path = "../sws-ir" }
sws-css = { path = "../sws-css" }
sws-plugin = { path = "../sws-plugin" }
sws-security = { path = "../sws-security" }
