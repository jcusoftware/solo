[package]
name = "sws-cli"
description = "Unified CLI and stdio MCP server (`solo`) for Solo (Solo Website System)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
default-run = "solo"

[[bin]]
name = "solo"
path = "src/main.rs"

# Host-only generator for @solo-website-system/ir-types and the pack schema.
# Kept out of `solo` itself: it needs the `codegen` feature.
[[bin]]
name = "sws-codegen"
path = "src/bin/sws-codegen.rs"
required-features = ["codegen"]

[features]
default = []
pack-hospitality = ["dep:sws-pack-hospitality"]
codegen = ["dep:sws-codegen", "sws-pack-hospitality?/jsonschema"]

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sws-ir = { path = "../sws-ir" }
sws-css = { path = "../sws-css" }
sws-plugin = { path = "../sws-plugin" }
sws-compiler = { path = "../sws-compiler" }
sws-security = { path = "../sws-security" }
sws-pack-hospitality = { path = "../../packs/hospitality/crate", optional = true }
sws-codegen = { path = "../sws-codegen", optional = true }
