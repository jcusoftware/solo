[package]
name = "sws-worker-site"
description = "Domain-agnostic published-site Cloudflare Worker for Solo Website System (SWS): static assets, schema-driven forms, newsletter consent, and dual security headers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sws-security = { path = "../sws-security" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.9", features = ["d1"] }
console_error_panic_hook = { version = "0.1", optional = true }
# Streamed outbound-response reads with hard byte caps (Google Calendar sync).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Web Crypto (SubtleCrypto) for the Google service-account JWT assertion.
web-sys = { version = "0.3", features = ["AbortSignal", "Crypto", "CryptoKey", "SubtleCrypto", "WorkerGlobalScope"] }

[features]
default = ["console_error_panic_hook"]
