name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (deny, test, wasm clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo test (host; includes _headers <-> headers.rs parity + ABC lint tests)
        run: |
          cargo test --workspace --locked
          cargo test -p sws-cli --features pack-hospitality --locked
      - name: cargo clippy (wasm32)
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown -p sws-security -p sws-worker-site -p sws-wasm -p sws-assets -p sws-worker-studio -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown -p sws-worker-studio --features insecure-dev-auth -- -D warnings

  export-bundle:
    name: export bundle (compiled + executed)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run solo export and execute the emitted crate's test module
        run: cargo test -p sws-cli --features pack-hospitality --locked --release -- --ignored export

  wasm-smoke:
    name: wasm export smoke test (node)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The wasm-bindgen CLI version must match the wasm-bindgen crate in
      # Cargo.lock (run-smoke.sh verifies the match before binding).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build wasm module and execute every export (smoke.mjs)
        run: crates/sws-wasm/run-smoke.sh
      - name: Editing gate (edit/undo/redo/save/reopen, native vs Wasm bytes)
        run: npm run gate:editing

  verify:
    name: verify (npm fast gate)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cargo deny (installs the binary npm run verify calls)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: npm run verify (contributor-safe subset; agents/devvit gates run via verify:full in the studio checkout)
        run: npm run verify

  wasm-dev:
    name: wasm dev build (cached, target features)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      # Rust-input-keyed cache: dev Wasm artifacts are separate from the release build.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker-build (exact pin from wasm-toolchain.json)
        run: cargo install worker-build@0.9.0 --locked
      - name: Cache worker-build downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/worker-build
          key: worker-build-${{ runner.os }}-${{ hashFiles('wasm-toolchain.json', 'Cargo.lock') }}
      - name: Dev Wasm build + target-feature check
        run: npm run build:wasm:dev

  web:
    name: web (render, ABC lint, header parity, a11y, lighthouse)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rendered HTML is up to date with venue.json
        run: npm run render:check
      - name: Static landing & docs sites are up to date
        run: npm run sites:check
      - name: Virginia ABC advertising lint
        run: npm run lint:abc
      - name: ABC linter catches the known-bad fixture
        run: "! npm run lint:abc:fixture"
      - name: Static header parity (_headers vs headers.rs)
        run: npm run check:headers && npm run sites:check:headers
      - name: Node unit tests
        run: npm run test:unit
      - name: Install worker-build (exact pin from wasm-toolchain.json)
        run: cargo install worker-build@0.9.0 --locked
      - name: Cache worker-build downloads (Binaryen wasm-opt, wasm-bindgen, esbuild)
        uses: actions/cache@v4
        with:
          path: ~/.cache/worker-build
          key: worker-build-${{ runner.os }}-${{ hashFiles('wasm-toolchain.json', 'Cargo.lock') }}
      - name: Pinned tools match wasm-toolchain.json (rustc, worker-build)
        run: npm run check:toolchain:installed
      - name: Build Worker (size-optimized release; verifies Binaryen pin and Wasm target features)
        run: npm run build:wasm:release
      - name: Frontend-only edits must not re-run Cargo (second build is a no-op)
        run: |
          out=$(npm run build:wasm:release)
          echo "$out"
          echo "$out" | grep -q 'skipping Cargo'
      - name: Build Studio Worker (size-optimized release; verifies Binaryen pin and Wasm target features)
        run: npm run studio:build
      - name: Release Studio Wasm must not carry any dev-auth marker (dev headers, fence var, /api/dev/)
        run: npm run check:studio:release -- --require-artifact
      - name: Local D1 migrations
        run: npx wrangler d1 migrations apply DB --local
      - name: Start wrangler dev
        run: |
          cp .dev.vars.example .dev.vars
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 --var DEV_MODE:true > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8787/api/health && exit 0
            sleep 2
          done
          cat wrangler-dev.log
          exit 1
      - name: Live header parity (/ and /api/health)
        run: npm run check:headers:live
      - name: Studio Worker live smoke (separate dev server, own local D1 state)
        run: |
          npm run studio:db:migrate:local
          # Own session/process group, so exactly this server tree can be stopped by PID.
          setsid nohup npm run studio:dev > studio-dev.log 2>&1 &
          studio_pid=$!
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8788/api/health; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat studio-dev.log
            kill -TERM -- "-$studio_pid" 2>/dev/null || true
            exit 1
          fi
          status=0
          npm run studio:check:live || status=$?
          # Stop only the Studio dev server's process group (npm, wrangler, workerd).
          kill -TERM -- "-$studio_pid" 2>/dev/null || true
          exit $status
      - name: Studio session integration tests (Durable Object, WebSockets, hibernation; own port 8790, own local state)
        # Builds a SEPARATE dev-auth Worker (build-dev-auth/), never the release build above.
        run: npm run test:studio:sessions
      - name: Studio asset store integration (own dev servers on 8791-8793 and local D1/R2 state; test-only dev-auth build)
        # Builds a SEPARATE dev-auth Worker (its own build-* directory). The test starts each
        # wrangler dev in its own process group and stops those groups itself.
        run: npm run test:studio:assets
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility + header gates (axe, WCAG 2.2 AA)
        run: npm run test:a11y
        env:
          BASE_URL: http://127.0.0.1:8787
      - name: Compiled checkout mock (no external traffic)
        run: npm run test:checkout
      - name: Lighthouse CI
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
            wrangler-dev.log
            studio-dev.log
          if-no-files-found: ignore
