name: release

on:
  push:
    tags:
      - 'v*'
      - 'pack-hospitality-v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag release (deny, test, wasm clippy, headers)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      has_cli: ${{ steps.detect.outputs.has_cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: cargo deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Tag/version sync (v* tag must match workspace version)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws_version=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep '^version' | head -n 1 | sed 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$tag" != "$ws_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version '$ws_version'."
            echo "::error::The built CLI would report --version $ws_version on a $GITHUB_REF_NAME release."
            echo "::error::Merge a release PR bumping [workspace.package] version to $tag, re-tag, and push again."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches workspace version $ws_version."
      - name: cargo test (workspace)
        run: cargo test --workspace --locked
      - name: cargo clippy (wasm32)
        run: |
          FLAGS=""
          [ -f core/Cargo.toml ] && FLAGS="$FLAGS -p sws-core"
          [ -f crates/sws-worker-site/Cargo.toml ] && FLAGS="$FLAGS -p sws-worker-site"
          [ -f crates/sws-wasm/Cargo.toml ] && FLAGS="$FLAGS -p sws-wasm"
          if [ -n "$FLAGS" ]; then
            cargo clippy --locked --target wasm32-unknown-unknown $FLAGS -- -D warnings
          fi
      - name: Static header parity (_headers vs Rust SECURITY_HEADERS)
        run: node core/tools/check-headers.mjs
      - name: Static sites up-to-date, header parity, and unit tests
        run: |
          node sites/build.mjs --check
          node core/tools/check-headers.mjs --headers-file sites/landing/public/_headers
          node core/tools/check-headers.mjs --headers-file sites/docs/public/_headers
          node --test tests/unit/sites-build.test.mjs
      - name: Detect sws-cli crate
        id: detect
        run: |
          if [ -f crates/sws-cli/Cargo.toml ]; then
            echo "has_cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cli=false" >> "$GITHUB_OUTPUT"
          fi

  release-cli-build:
    name: solo CLI (${{ matrix.target }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify.outputs.has_cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin: solo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin: solo
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
            bin: solo
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: solo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: solo.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build sws-cli
        run: cargo build --release --locked --target ${{ matrix.target }} -p sws-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package tar.gz (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          tar -C dist -czf "dist/solo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "${{ matrix.bin }}"
          rm "dist/${{ matrix.bin }}"
      - name: Package zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"
          Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "dist/solo-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Remove-Item "dist/${{ matrix.bin }}"
      - name: Upload target archive
        uses: actions/upload-artifact@v4
        with:
          name: solo-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release-publish:
    name: Publish GitHub Release & Static Sites (Landing + Docs)
    needs: [verify, release-cli-build]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' && (needs.release-cli-build.result == 'success' || needs.release-cli-build.result == 'skipped')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download solo CLI artifacts
        if: needs.verify.outputs.has_cli == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        if: needs.verify.outputs.has_cli == 'true'
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.verify.outputs.has_cli }}" = "true" ]; then
            gh release create "${{ github.ref_name }}" dist/* \
              --title "Solo ${{ github.ref_name }}" \
              --generate-notes \
              --verify-tag
          else
            gh release create "${{ github.ref_name }}" \
              --title "Solo ${{ github.ref_name }}" \
              --generate-notes \
              --verify-tag
          fi
      - name: Check Cloudflare deploy configuration
        id: cf_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Skipping Cloudflare static site deploys (CLOUDFLARE_API_TOKEN secret not set)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.cf_deploy.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies (wrangler)
        if: steps.cf_deploy.outputs.enabled == 'true'
        run: npm ci
      - name: Build static sites (landing + docs)
        if: steps.cf_deploy.outputs.enabled == 'true'
        env:
          SWS_RELEASE_VERSION: ${{ github.ref_name }}
          SWS_HAS_CLI: ${{ needs.verify.outputs.has_cli }}
          SWS_GITHUB_REPO: ${{ github.repository }}
          SWS_LANDING_URL: ${{ vars.SWS_LANDING_URL || 'https://solo.jcusoftware.com' }}
          SWS_DOCS_URL: ${{ vars.SWS_DOCS_URL || 'https://docs.jcusoftware.com' }}
          SWS_SHOWCASE_URL: ${{ vars.SWS_SHOWCASE_URL }}
        run: |
          node sites/build.mjs
          node core/tools/check-headers.mjs --headers-file sites/landing/public/_headers
          node core/tools/check-headers.mjs --headers-file sites/docs/public/_headers
      - name: Deploy landing site (sws-landing) to Cloudflare
        if: steps.cf_deploy.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c sites/landing/wrangler.jsonc
      - name: Deploy docs site (sws-docs) to Cloudflare
        if: steps.cf_deploy.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c sites/docs/wrangler.jsonc

  release-pack-hospitality:
    name: release hospitality pack (pack-hospitality-v*)
    if: startsWith(github.ref, 'refs/tags/pack-hospitality-v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify packs/hospitality crate exists
        run: |
          if [ ! -f packs/hospitality/crate/Cargo.toml ]; then
            echo "Error: packs/hospitality/crate/Cargo.toml not found on this tag."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Tag/version sync (pack tag must match workspace version)
        run: |
          tag="${GITHUB_REF_NAME#pack-hospitality-v}"
          ws_version=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml | grep '^version' | head -n 1 | sed 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$tag" != "$ws_version" ]; then
            echo "::error::Pack tag $GITHUB_REF_NAME does not match workspace version '$ws_version'."
            echo "::error::The pack crate inherits version.workspace; merge a release PR bumping [workspace.package] version to $tag, re-tag, and push again."
            exit 1
          fi
          echo "Pack tag $GITHUB_REF_NAME matches workspace version $ws_version."
      - name: Verify sws-pack-hospitality (test + clippy)
        run: |
          cargo test -p sws-pack-hospitality --locked
          cargo clippy -p sws-pack-hospitality --locked -- -D warnings
      - name: Package hospitality pack artifact
        run: |
          mkdir -p dist
          tar --exclude='packs/hospitality/target' --exclude='packs/hospitality/node_modules' \
            -czf "dist/sws-pack-hospitality-${{ github.ref_name }}.tar.gz" packs/hospitality
          (cd dist && sha256sum "sws-pack-hospitality-${{ github.ref_name }}.tar.gz" > SHA256SUMS.txt)
      - name: Create GitHub Release for hospitality pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "SWS Hospitality Pack ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
